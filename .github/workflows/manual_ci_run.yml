name: manual-ci-run
permissions:
  actions: read
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-cuda-docker-env:
    runs-on: [self-hosted, linux]
    environment:
      name: automatic-ci-run
    steps:
    - name: Checkout built branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
    - name: Check GPU visibility on runner
      run: |
        if command -v nvidia-smi; then
          nvidia-smi
        else
          /usr/lib/wsl/lib/nvidia-smi
        fi
    - name: Build CUDA similie_env image
      run: |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BACKEND=cuda \
          -t "similie_env:${GITHUB_SHA}" \
          -t similie_env:latest \
          docker/similie_env

  build-cpu-docker-env:
    runs-on: [self-hosted, linux]
    environment:
      name: automatic-ci-run
    steps:
    - name: Checkout built branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
    - name: Build CPU similie_env_cpu image
      run: |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BACKEND=cpu \
          --build-arg BASE_IMAGE=ubuntu:26.04 \
          -t "similie_env_cpu:${GITHUB_SHA}" \
          -t similie_env_cpu:latest \
          docker/similie_env

  build-cuda:
    needs: build-cuda-docker-env
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ github.event_name == 'pull_request' && 'build-cuda' || 'automatic-ci-run' }}
    env:
      COMPILATION_NUM_THREADS: ${{ vars.COMPILATION_NUM_THREADS || '8' }}
    steps:
    - name: Checkout built branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        submodules: recursive
        fetch-depth: 0
    - name: Clear temporary workspace path
      run: |
        echo "IMAGE_TAG=similie_env:${GITHUB_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=/tmp/similie-cuda-workspace-${GITHUB_RUN_ID}-${GITHUB_SHA}" >> "${GITHUB_ENV}"
        rm -rf "/tmp/similie-cuda-workspace-${GITHUB_RUN_ID}-${GITHUB_SHA}"
    - name: Populate CUDA commit workspace
      run: |
        mkdir -p "${CACHE_ROOT}/src" "${CACHE_ROOT}/build" "${CACHE_ROOT}/home"
        rsync -a --delete "${GITHUB_WORKSPACE}/" "${CACHE_ROOT}/src/"
    - name: Configure and compile on GPU
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm --gpus all \
          --user "$(id -u):$(id -g)" \
          -e HOME="${CACHE_ROOT}/home" \
          -e CACHE_ROOT="${CACHE_ROOT}" \
          -e COMPILATION_NUM_THREADS="${COMPILATION_NUM_THREADS}" \
          -v "${CACHE_ROOT}:${CACHE_ROOT}" \
          -w "${CACHE_ROOT}/src" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi
            # The installed Kokkos package supplies its CUDA architecture flags.
            cmake \
              -DCMAKE_CXX_COMPILER=/opt/kokkos/bin/nvcc_wrapper \
              -DCMAKE_BUILD_TYPE=Release \
              -DKokkos_ENABLE_CUDA=ON \
              -DKokkos_ENABLE_DEPRECATION_WARNINGS=OFF \
              -DSIMILIE_BUILD_BENCHMARKS=ON \
              -DSIMILIE_ASSERT_EXAMPLE_RESULTS_CORRECTNESS=ON \
              -B "${CACHE_ROOT}/build" \
              -S .
            make -j"${COMPILATION_NUM_THREADS}" -C "${CACHE_ROOT}/build"
          '
    - name: Package CUDA build workspace
      run: tar -I 'gzip -1' -cf "${RUNNER_TEMP}/similie-cuda-workspace.tar.gz" --exclude='*/.git' -C "${CACHE_ROOT}" .
    - name: Upload CUDA build workspace
      uses: actions/upload-artifact@v7
      with:
        name: similie-cuda-${{ github.sha }}
        overwrite: true
        path: ${{ runner.temp }}/similie-cuda-workspace.tar.gz
        compression-level: 0
        retention-days: 1

  build-omp-debug:
    needs: build-cpu-docker-env
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ github.event_name == 'pull_request' && 'build-omp-debug' || 'automatic-ci-run' }}
    env:
      COMPILATION_NUM_THREADS: ${{ vars.COMPILATION_NUM_THREADS || '8' }}
    steps:
    - name: Checkout built branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        submodules: recursive
        fetch-depth: 0
    - name: Clear temporary workspace path
      run: |
        echo "IMAGE_TAG=similie_env_cpu:${GITHUB_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=/tmp/similie-omp-workspace-${GITHUB_RUN_ID}-${GITHUB_SHA}" >> "${GITHUB_ENV}"
        rm -rf "/tmp/similie-omp-workspace-${GITHUB_RUN_ID}-${GITHUB_SHA}"
    - name: Populate OpenMP commit workspace
      run: |
        mkdir -p "${CACHE_ROOT}/src" "${CACHE_ROOT}/build_omp" "${CACHE_ROOT}/home"
        rsync -a --delete "${GITHUB_WORKSPACE}/" "${CACHE_ROOT}/src/"
    - name: Configure and compile with OpenMP
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME="${CACHE_ROOT}/home" \
          -e CACHE_ROOT="${CACHE_ROOT}" \
          -e COMPILATION_NUM_THREADS="${COMPILATION_NUM_THREADS}" \
          -v "${CACHE_ROOT}:${CACHE_ROOT}" \
          -w "${CACHE_ROOT}/src" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            git config --global --add safe.directory "*"
            g++-15 --version
            cmake \
              -DCMAKE_CXX_COMPILER=g++-15 \
              -DCMAKE_BUILD_TYPE=Debug \
              -DKokkos_ENABLE_OPENMP=ON \
              -DKokkos_ENABLE_DEPRECATION_WARNINGS=OFF \
              -DSIMILIE_BUILD_YOUNG_TABLEAU=ON \
              -DSIMILIE_ASSERT_EXAMPLE_RESULTS_CORRECTNESS=ON \
              -B "${CACHE_ROOT}/build_omp" \
              -S .
            make -j"${COMPILATION_NUM_THREADS}" -C "${CACHE_ROOT}/build_omp"
          '
    - name: Package OpenMP build workspace
      run: tar -I 'gzip -1' -cf "${RUNNER_TEMP}/similie-omp-workspace.tar.gz" --exclude='*/.git' -C "${CACHE_ROOT}" .
    - name: Upload OpenMP build workspace
      uses: actions/upload-artifact@v7
      with:
        name: similie-omp-${{ github.sha }}
        overwrite: true
        path: ${{ runner.temp }}/similie-omp-workspace.tar.gz
        compression-level: 0
        retention-days: 1

  tests-cuda:
    needs: build-cuda
    runs-on: [self-hosted, linux]
    environment:
      name: tests-cuda
    steps:
    - name: Set build paths
      run: |
        echo "IMAGE_TAG=similie_env:${GITHUB_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${RUNNER_TEMP}/similie-cuda-download-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=/tmp/similie-cuda-workspace-${GITHUB_RUN_ID}-${GITHUB_SHA}" >> "${GITHUB_ENV}"
        rm -rf "${RUNNER_TEMP}/similie-cuda-download-${GITHUB_RUN_ID}-${GITHUB_JOB}"
    - name: Download CUDA build workspace
      uses: actions/download-artifact@v8
      with:
        name: similie-cuda-${{ github.sha }}
        path: ${{ runner.temp }}/similie-cuda-download-${{ github.run_id }}-${{ github.job }}
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Extract CUDA build workspace
      run: |
        tar -xzf "${CACHE_ROOT}/similie-cuda-workspace.tar.gz" -C "${CACHE_ROOT}"
        rm "${CACHE_ROOT}/similie-cuda-workspace.tar.gz"
    - name: Run CUDA tests
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm --gpus all \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi
            ctest --output-on-failure
          '

  tests-omp-debug:
    needs: build-omp-debug
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ github.event_name == 'pull_request' && 'tests-omp-debug' || 'automatic-ci-run' }}
    steps:
    - name: Set build paths
      run: |
        echo "IMAGE_TAG=similie_env_cpu:${GITHUB_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${RUNNER_TEMP}/similie-omp-download-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=/tmp/similie-omp-workspace-${GITHUB_RUN_ID}-${GITHUB_SHA}" >> "${GITHUB_ENV}"
        rm -rf "${RUNNER_TEMP}/similie-omp-download-${GITHUB_RUN_ID}-${GITHUB_JOB}"
    - name: Download OpenMP build workspace
      uses: actions/download-artifact@v8
      with:
        name: similie-omp-${{ github.sha }}
        path: ${{ runner.temp }}/similie-omp-download-${{ github.run_id }}-${{ github.job }}
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Extract OMP build workspace
      run: |
        tar -xzf "${CACHE_ROOT}/similie-omp-workspace.tar.gz" -C "${CACHE_ROOT}"
        rm "${CACHE_ROOT}/similie-omp-workspace.tar.gz"
    - name: Run OpenMP tests
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build_omp" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            git config --global --add safe.directory "*"
            ctest --output-on-failure
          '

  example-2d_laplacian:
    needs: build-cuda
    uses: ./.github/workflows/example_laplacian.yml
    with:
      target_sha: ${{ github.sha }}
      ci_environment: laplacians-cuda

  example-2d_vector_laplacian:
    needs: build-cuda
    uses: ./.github/workflows/example_laplacian_vector.yml
    with:
      target_sha: ${{ github.sha }}
      ci_environment: laplacians-cuda

  example-2d_scalar_field:
    needs: build-cuda
    uses: ./.github/workflows/example_scalar_field.yml
    with:
      target_sha: ${{ github.sha }}
      ci_environment: scalar-field-cuda

  example-onelab_inductor:
    needs: build-cuda
    uses: ./.github/workflows/example_onelab_inductor.yml
    with:
      target_sha: ${{ github.sha }}
      ci_environment: ${{ github.event_name == 'pull_request' && 'onelab_inductor-cuda' || 'automatic-ci-run' }}

  example-onelab_elasticity:
    needs: build-cuda
    uses: ./.github/workflows/example_onelab_elasticity.yml
    with:
      target_sha: ${{ github.sha }}
      ci_environment: ${{ github.event_name == 'pull_request' && 'onelab_elasticity-cuda' || 'automatic-ci-run' }}

  example-onelab_potential_flow:
    needs: build-cuda
    uses: ./.github/workflows/example_onelab_potential_flow.yml
    with:
      target_sha: ${{ github.sha }}
      ci_environment: ${{ github.event_name == 'pull_request' && 'onelab_potential-flow-onelab-cuda' || 'automatic-ci-run' }}

  example-kretschmann_scalar:
    needs: build-omp-debug
    uses: ./.github/workflows/example_kretschmann_scalar.yml
    with:
      target_sha: ${{ github.sha }}
      ci_environment: ${{ github.event_name == 'pull_request' && 'examples-omp-debug' || 'automatic-ci-run' }}

  benchmark-taylor-green-vortex:
    needs: build-cuda
    uses: ./.github/workflows/benchmark_taylor_green_vortex.yml
    with:
      target_sha: ${{ github.sha }}
      ci_environment: taylor_green_vortex-cuda
