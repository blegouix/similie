name: tests
permissions:
  actions: read
  contents: read
on:
  workflow_run:
    workflows: [ build ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to test
        required: false
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      test_target:
        required: false
        type: string
        default: all
      ci_environment:
        required: false
        type: string

concurrency:
  group: tests-${{ inputs.test_target || 'all' }}-${{ inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  tests-cuda:
    if: (inputs.target_sha || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (!inputs.test_target || inputs.test_target == 'all' || inputs.test_target == 'cuda')
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ inputs.ci_environment || ((github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')) && 'tests-cuda' || 'automatic-ci-run') }}
    steps:
    - name: Select target commit
      id: target
      run: |
        if [ -n "${{ inputs.target_sha }}" ]; then
          target_sha="${{ inputs.target_sha }}"
        elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
          target_sha="${{ github.event.workflow_run.head_sha }}"
        else
          target_sha="${GITHUB_SHA}"
        fi
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
    - name: Require matching persistent CUDA build
      run: |
        set -euo pipefail
        BUILD_ROOT="${RUNNER_WORKSPACE}/builds/cuda"
        echo "IMAGE_TAG=similie_env:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=${BUILD_ROOT}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${BUILD_ROOT}" >> "${GITHUB_ENV}"
        test -f "${BUILD_ROOT}/COMMIT_SHA" || { echo "Missing persistent build at ${BUILD_ROOT}" >&2; exit 1; }
        test "$(cat "${BUILD_ROOT}/COMMIT_SHA")" = "${TARGET_SHA}" || { echo "Build commit tag does not match ${TARGET_SHA}" >&2; exit 1; }
        test -d "${BUILD_ROOT}/build"
    - name: Run CUDA tests
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm --gpus all \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi
            ctest --output-on-failure
          '

  tests-omp-debug:
    if: (inputs.target_sha || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (!inputs.test_target || inputs.test_target == 'all' || inputs.test_target == 'omp')
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ inputs.ci_environment || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && 'tests-omp-debug' || 'automatic-ci-run') }}
    steps:
    - name: Select target commit
      id: target
      run: |
        if [ -n "${{ inputs.target_sha }}" ]; then
          target_sha="${{ inputs.target_sha }}"
        elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
          target_sha="${{ github.event.workflow_run.head_sha }}"
        else
          target_sha="${GITHUB_SHA}"
        fi
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
    - name: Require matching persistent OMP debug build
      run: |
        set -euo pipefail
        BUILD_ROOT="${RUNNER_WORKSPACE}/builds/omp-debug"
        echo "IMAGE_TAG=similie_env_cpu:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=${BUILD_ROOT}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${BUILD_ROOT}" >> "${GITHUB_ENV}"
        test -f "${BUILD_ROOT}/COMMIT_SHA" || { echo "Missing persistent build at ${BUILD_ROOT}" >&2; exit 1; }
        test "$(cat "${BUILD_ROOT}/COMMIT_SHA")" = "${TARGET_SHA}" || { echo "Build commit tag does not match ${TARGET_SHA}" >&2; exit 1; }
        test -d "${BUILD_ROOT}/build_omp"
    - name: Run OpenMP tests
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build_omp" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            git config --global --add safe.directory "*"
            ctest --output-on-failure
          '
