name: base-ci-run
on:
  workflow_run:
    workflows: [ci-build]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: base-ci-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-context:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/ci_build_context.yml
    with:
      build_run_id: ${{ format('{0}', github.event.workflow_run.id) }}

  tests-cuda:
    needs: build-context
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ needs.build-context.outputs.is_pr == 'true' && 'tests-cuda' || 'base-ci-run' }}
    env:
      TARGET_SHA: ${{ needs.build-context.outputs.target_sha }}
    steps:
    - name: Set build paths
      run: |
        echo "IMAGE_TAG=similie_env:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${RUNNER_WORKSPACE}/builds/cuda" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=${RUNNER_WORKSPACE}/builds/cuda" >> "${GITHUB_ENV}"
    - name: Require matching CUDA build
      run: |
        set -euo pipefail
        test -f "${BUILD_ROOT}/COMMIT_SHA"
        test "$(cat "${BUILD_ROOT}/COMMIT_SHA")" = "${TARGET_SHA}"
        test -d "${BUILD_ROOT}/build"
    - name: Run CUDA tests
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm --gpus all \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi
            ctest --output-on-failure
          '

  tests-omp-debug:
    needs: build-context
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ needs.build-context.outputs.is_pr == 'true' && 'tests-omp-debug' || 'base-ci-run' }}
    env:
      TARGET_SHA: ${{ needs.build-context.outputs.target_sha }}
    steps:
    - name: Set build paths
      run: |
        echo "IMAGE_TAG=similie_env_cpu:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${RUNNER_WORKSPACE}/builds/omp-debug" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=${RUNNER_WORKSPACE}/builds/omp-debug" >> "${GITHUB_ENV}"
    - name: Require matching OMP debug build
      run: |
        set -euo pipefail
        test -f "${BUILD_ROOT}/COMMIT_SHA"
        test "$(cat "${BUILD_ROOT}/COMMIT_SHA")" = "${TARGET_SHA}"
        test -d "${BUILD_ROOT}/build_omp"
    - name: Run OpenMP tests
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build_omp" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            git config --global --add safe.directory "*"
            ctest --output-on-failure
          '

  example-2d_laplacian:
    needs: build-context
    uses: ./.github/workflows/example_laplacian.yml
    with:
      target_sha: ${{ needs.build-context.outputs.target_sha }}
      ci_environment: ${{ needs.build-context.outputs.is_pr == 'true' && 'laplacians-cuda' || 'base-ci-run' }}

  example-2d_vector_laplacian:
    needs: build-context
    uses: ./.github/workflows/example_laplacian_vector.yml
    with:
      target_sha: ${{ needs.build-context.outputs.target_sha }}
      ci_environment: ${{ needs.build-context.outputs.is_pr == 'true' && 'laplacians-cuda' || 'base-ci-run' }}

  example-onelab_inductor:
    needs: build-context
    uses: ./.github/workflows/example_onelab_inductor.yml
    with:
      target_sha: ${{ needs.build-context.outputs.target_sha }}
      ci_environment: ${{ needs.build-context.outputs.is_pr == 'true' && 'onelab_inductor-cuda' || 'base-ci-run' }}

  example-onelab_elasticity:
    needs: build-context
    uses: ./.github/workflows/example_onelab_elasticity.yml
    with:
      target_sha: ${{ needs.build-context.outputs.target_sha }}
      ci_environment: ${{ needs.build-context.outputs.is_pr == 'true' && 'onelab_elasticity-cuda' || 'base-ci-run' }}

  example-onelab_potential_flow:
    needs: build-context
    uses: ./.github/workflows/example_onelab_potential_flow.yml
    with:
      target_sha: ${{ needs.build-context.outputs.target_sha }}
      ci_environment: ${{ needs.build-context.outputs.is_pr == 'true' && 'onelab_potential-flow-onelab-cuda' || 'base-ci-run' }}

  example-kretschmann_scalar:
    needs: build-context
    uses: ./.github/workflows/example_kretschmann_scalar.yml
    with:
      target_sha: ${{ needs.build-context.outputs.target_sha }}
      ci_environment: ${{ needs.build-context.outputs.is_pr == 'true' && 'examples-omp-debug' || 'base-ci-run' }}
