name: benchmark_taylor_green_vortex
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Workflow run ID containing the matching compiled artifact
        required: false
      target_sha:
        description: Full commit SHA with an existing CUDA Docker image
        required: false
  workflow_call:
    inputs:
      build_run_id:
        required: false
        type: string
      target_sha:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: tgv-ci-${{ inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  physics:
    if: inputs.target_sha || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: ${{ matrix.fluid }}-${{ matrix.transport }}-${{ matrix.coupling }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 1380
    environment:
      name: taylor_green_vortex-cuda
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        fluid: [incompressible, compressible]
        transport: [ideal, resistive]
        coupling: [hd, ehd, mhd, fmhd]
        exclude:
        - transport: resistive
          coupling: hd
    env:
      FLUID: ${{ matrix.fluid }}
      TRANSPORT: ${{ matrix.transport }}
      COUPLING: ${{ matrix.coupling }}
    steps:
    - name: Select target commit and isolated output path
      id: target
      env:
        INPUT_SHA: ${{ inputs.target_sha }}
        UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        target_sha="${INPUT_SHA:-${UPSTREAM_SHA:-${GITHUB_SHA}}}"
        [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "CI_ROOT=${RUNNER_TEMP}/similie-tgv-cuda-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FLUID}-${TRANSPORT}-${COUPLING}" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=/tmp/similie-cuda-workspace-${{ steps.artifact-run.outputs.run_id }}-${target_sha}" >> "${GITHUB_ENV}"
        echo "ARTIFACT_ROOT=${RUNNER_TEMP}/similie-cuda-download-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "${GITHUB_ENV}"
        rm -rf "${RUNNER_TEMP}/similie-cuda-download-${GITHUB_RUN_ID}-${GITHUB_JOB}"
    - name: Resolve CUDA build artifact run
      id: artifact-run
      uses: actions/github-script@v7
      env:
        TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        BUILD_RUN_ID_INPUT: ${{ inputs.build_run_id }}
        ARTIFACT_NAME: similie-cuda-${{ steps.target.outputs.target_sha }}
      with:
        script: |
          if (process.env.BUILD_RUN_ID_INPUT) {
            core.setOutput('run_id', process.env.BUILD_RUN_ID_INPUT);
          } else if (context.eventName === 'workflow_run') {
            core.setOutput('run_id', String(context.payload.workflow_run.id));
          } else if (context.eventName === 'workflow_dispatch') {
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name: process.env.ARTIFACT_NAME, per_page: 100,
            });
            const matches = artifacts.filter((artifact) => !artifact.expired &&
              artifact.name === process.env.ARTIFACT_NAME && artifact.workflow_run);
            matches.sort((left, right) => right.id - left.id);
            if (matches.length === 0) core.setFailed(`No CUDA build artifact found for ${process.env.TARGET_SHA}`);
            else core.setOutput('run_id', String(matches[0].workflow_run.id));
          } else {
            core.setOutput('run_id', String(context.runId));
          }
    - name: Download CUDA build workspace
      uses: actions/download-artifact@v8
      with:
        name: similie-cuda-${{ steps.target.outputs.target_sha }}
        path: ${{ runner.temp }}/similie-cuda-download-${{ github.run_id }}-${{ github.job }}
        run-id: ${{ steps.artifact-run.outputs.run_id }}
        github-token: ${{ github.token }}
    - name: Extract CUDA build workspace
      run: |
        tar -xzf "${ARTIFACT_ROOT}/similie-cuda-workspace.tar.gz" -C "${ARTIFACT_ROOT}"
        rm "${ARTIFACT_ROOT}/similie-cuda-workspace.tar.gz"
    - name: Run benchmark in CUDA Docker
      run: |
        set -euo pipefail
        mkdir -p "${CI_ROOT}/results"
        docker image inspect "similie_env:${TARGET_SHA}" >/dev/null
        docker run --rm --gpus all --user "$(id -u):$(id -g)" \
          -e CI_ROOT -e FLUID -e TRANSPORT -e COUPLING \
          -e TARGET_SHA -e BUILD_ROOT -e HOME="${BUILD_ROOT}/home" \
          -e SIMILIE_SOLVER_PROGRESS_STRIDE=0 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          -v "${CI_ROOT}:${CI_ROOT}" -v "${ARTIFACT_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build" "similie_env:${TARGET_SHA}" bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi
            python3 "${BUILD_ROOT}/src/benchmarks/taylor_green_vortex/ci_campaign.py" \
              --binary "${BUILD_ROOT}/build/benchmarks/taylor_green_vortex/taylor_green_vortex" \
              --output "${CI_ROOT}/results" --fluid "${FLUID}" \
              --transport "${TRANSPORT}" --coupling "${COUPLING}"
          '
    - name: Publish job summary
      if: always()
      run: |
        if [ -f "${CI_ROOT}/results/report.md" ]; then
          cat "${CI_ROOT}/results/report.md" >> "${GITHUB_STEP_SUMMARY}"
        fi
    - name: Upload performance and reference outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: tgv-cuda-${{ matrix.fluid }}-${{ matrix.transport }}-${{ matrix.coupling }}-${{ steps.target.outputs.target_sha }}
        path: ${{ env.CI_ROOT }}/results/
        if-no-files-found: error
        compression-level: 1
        retention-days: 14
