name: benchmark_taylor_green_vortex
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full commit SHA with an existing CUDA Docker image
        required: false
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      ci_environment:
        required: false
        type: string
        default: taylor_green_vortex-cuda

permissions:
  contents: read

concurrency:
  group: tgv-ci-${{ inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  physics:
    if: inputs.target_sha || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: ${{ matrix.fluid }}-${{ matrix.transport }}-${{ matrix.coupling }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 1380
    environment:
      name: ${{ inputs.ci_environment || 'taylor_green_vortex-cuda' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        fluid: [incompressible, compressible]
        transport: [ideal, resistive]
        coupling: [hd, ehd, mhd, fmhd]
        exclude:
        - transport: resistive
          coupling: hd
    env:
      FLUID: ${{ matrix.fluid }}
      TRANSPORT: ${{ matrix.transport }}
      COUPLING: ${{ matrix.coupling }}
    steps:
    - name: Select target commit and isolated output path
      id: target
      env:
        INPUT_SHA: ${{ inputs.target_sha }}
        UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        target_sha="${INPUT_SHA:-${UPSTREAM_SHA:-${GITHUB_SHA}}}"
        [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "CI_ROOT=${RUNNER_TEMP}/similie-tgv-cuda-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FLUID}-${TRANSPORT}-${COUPLING}" >> "${GITHUB_ENV}"
    - uses: actions/checkout@v6
      with:
        ref: ${{ steps.target.outputs.target_sha }}
        submodules: recursive
        fetch-depth: 0
    - name: Build SimiLie and run benchmark in CUDA Docker
      run: |
        set -euo pipefail
        mkdir -p "${CI_ROOT}/results"
        docker image inspect "similie_env:${TARGET_SHA}" >/dev/null
        docker run --rm --gpus all --user "$(id -u):$(id -g)" \
          -e CI_ROOT -e FLUID -e TRANSPORT -e COUPLING \
          -e TARGET_SHA -e GITHUB_WORKSPACE \
          -e SIMILIE_SOLVER_PROGRESS_STRIDE=0 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          -v "${CI_ROOT}:${CI_ROOT}" -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -w "${GITHUB_WORKSPACE}" "similie_env:${TARGET_SHA}" bash -lc '
            set -euo pipefail
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi
            cmake -E rm -rf agent_build
            cmake -S . -B agent_build \
              -DCMAKE_CXX_COMPILER=/opt/kokkos/bin/nvcc_wrapper -DCMAKE_BUILD_TYPE=Release \
              -DKokkos_ENABLE_OPENMP=OFF -DKokkos_ENABLE_CUDA=ON \
              -DSIMILIE_BUILD_BENCHMARKS=ON -DSIMILIE_BUILD_ONELAB_INTERFACE=OFF \
              -DBUILD_TESTING=ON
            cmake --build agent_build --parallel 8 --target taylor_green_vortex
            python3 "${1}/benchmarks/taylor_green_vortex/ci_campaign.py" \
              --binary "${GITHUB_WORKSPACE}/agent_build/benchmarks/taylor_green_vortex/taylor_green_vortex" \
              --output "${CI_ROOT}/results" --fluid "${FLUID}" \
              --transport "${TRANSPORT}" --coupling "${COUPLING}"
          ' bash "${GITHUB_WORKSPACE}"
    - name: Publish job summary
      if: always()
      run: |
        if [ -f "${CI_ROOT}/results/report.md" ]; then
          cat "${CI_ROOT}/results/report.md" >> "${GITHUB_STEP_SUMMARY}"
        fi
    - name: Upload performance and reference outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: tgv-cuda-${{ matrix.fluid }}-${{ matrix.transport }}-${{ matrix.coupling }}-${{ steps.target.outputs.target_sha }}
        path: ${{ env.CI_ROOT }}/results/
        if-no-files-found: error
        compression-level: 1
        retention-days: 14
