name: example_laplacian
permissions:
  actions: read
  contents: read
on:
  workflow_run:
    workflows: [ build ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to run the example from
        required: false
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      ci_environment:
        required: false
        type: string

concurrency:
  group: example-2d_laplacian-${{ inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  example-2d_laplacian:
    if: inputs.target_sha || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ inputs.ci_environment || ((github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')) && 'laplacians-cuda' || 'automatic-ci-run') }}
    steps:
    - name: Prepare example log
      run: |
        echo "EXAMPLE_LOG=${RUNNER_TEMP}/example-2d_laplacian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" >> "${GITHUB_ENV}"
        printf 'Workflow run: %s, attempt: %s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" > "${RUNNER_TEMP}/example-2d_laplacian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
    - name: Select target commit
      id: target
      run: |
        if [ -n "${{ inputs.target_sha }}" ]; then
          target_sha="${{ inputs.target_sha }}"
        elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
          target_sha="${{ github.event.workflow_run.head_sha }}"
        else
          target_sha="${GITHUB_SHA}"
        fi
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
    - name: Require matching persistent CUDA build
      run: |
        set -euo pipefail
        BUILD_ROOT="${RUNNER_WORKSPACE}/builds/cuda"
        echo "IMAGE_TAG=similie_env:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=${BUILD_ROOT}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${BUILD_ROOT}" >> "${GITHUB_ENV}"
        test -f "${BUILD_ROOT}/COMMIT_SHA" || { echo "Missing persistent build at ${BUILD_ROOT}" >&2; exit 1; }
        test "$(cat "${BUILD_ROOT}/COMMIT_SHA")" = "${TARGET_SHA}" || { echo "Build commit tag does not match ${TARGET_SHA}" >&2; exit 1; }
        test -d "${BUILD_ROOT}/build"
    - name: Run 2d_laplacian on GPU
      shell: bash
      run: |
        set -o pipefail
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm --gpus all \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi
            ./examples/2d_laplacian
          ' 2>&1 | tee -a "${EXAMPLE_LOG}"
    - name: Upload example outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: example-2d_laplacian
        overwrite: true
        retention-days: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')) && 15 || 0 }}
        if-no-files-found: error
        path: |
          ${{ env.EXAMPLE_LOG }}
          ${{ env.CACHE_ROOT }}/build/2d_laplacian.h5
          ${{ env.CACHE_ROOT }}/build/2d_laplacian.xmf
