name: example_scalar_field
permissions:
  actions: read
  contents: read
on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string

concurrency:
  group: example-2d_scalar_field-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: true

jobs:
  example-2d_scalar_field:
    runs-on: [self-hosted, linux]
    timeout-minutes: 240
    environment: scalar-field-cuda
    steps:
    - name: Prepare example log
      run: |
        echo "EXAMPLE_LOG=${RUNNER_TEMP}/example-2d_scalar_field-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" >> "${GITHUB_ENV}"
        printf 'Workflow run: %s, attempt: %s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" > "${RUNNER_TEMP}/example-2d_scalar_field-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
    - name: Select target commit
      id: target
      env:
        INPUT_SHA: ${{ inputs.target_sha }}
      run: |
        set -euo pipefail
        target_sha="${INPUT_SHA:-${GITHUB_SHA}}"
        [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
    - name: Require matching persistent CUDA build
      run: |
        set -euo pipefail
        BUILD_ROOT="${RUNNER_WORKSPACE}/builds/cuda"
        echo "IMAGE_TAG=similie_env:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=${BUILD_ROOT}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${BUILD_ROOT}" >> "${GITHUB_ENV}"
        test -f "${BUILD_ROOT}/COMMIT_SHA" || { echo "Missing persistent build at ${BUILD_ROOT}" >&2; exit 1; }
        test "$(cat "${BUILD_ROOT}/COMMIT_SHA")" = "${TARGET_SHA}" || { echo "Build commit tag does not match ${TARGET_SHA}" >&2; exit 1; }
        test -d "${BUILD_ROOT}/build"
    - name: Run 2d_scalar_field on GPU
      shell: bash
      run: |
        set -o pipefail
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm --gpus all \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi
            ./examples/2d_scalar_field
          ' 2>&1 | tee -a "${EXAMPLE_LOG}"
    - name: Upload example outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: example-2d_scalar_field
        overwrite: true
        retention-days: 15
        if-no-files-found: error
        path: |
          ${{ env.EXAMPLE_LOG }}
          ${{ env.CACHE_ROOT }}/build/2d_scalar_field.h5
          ${{ env.CACHE_ROOT }}/build/2d_scalar_field.xmf
