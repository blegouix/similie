name: example_onelab_inductor
permissions:
  actions: read
  contents: read
on:
  workflow_run:
    workflows: [ build ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Workflow run ID containing the matching compiled artifact
        required: false
      target_sha:
        description: Commit SHA to run the example from
        required: false
  workflow_call:
    inputs:
      build_run_id:
        required: false
        type: string
      target_sha:
        required: true
        type: string
      ci_environment:
        required: false
        type: string
        default: automatic-ci-run

concurrency:
  group: example-onelab_inductor-${{ inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  example-onelab_inductor:
    if: inputs.target_sha || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case:
        - name: 2d-linear-assembled-matrix
          dimension: 2
          physics: linear
          backend: assembled-matrix
        - name: 2d-linear-matrix-free
          dimension: 2
          physics: linear
          backend: matrix-free
        - name: 2d-nonlinear-assembled-matrix
          dimension: 2
          physics: nonlinear
          backend: assembled-matrix
        - name: 2d-nonlinear-matrix-free
          dimension: 2
          physics: nonlinear
          backend: matrix-free
        - name: 3d-linear-assembled-matrix
          dimension: 3
          physics: linear
          backend: assembled-matrix
        - name: 3d-linear-matrix-free
          dimension: 3
          physics: linear
          backend: matrix-free
        - name: 3d-nonlinear-assembled-matrix
          dimension: 3
          physics: nonlinear
          backend: assembled-matrix
        - name: 3d-nonlinear-matrix-free
          dimension: 3
          physics: nonlinear
          backend: matrix-free
    environment:
      name: ${{ inputs.ci_environment || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && 'onelab_inductor-cuda' || 'automatic-ci-run') }}
    steps:
    - name: Prepare example log
      run: |
        echo "EXAMPLE_LOG=${RUNNER_TEMP}/example-onelab_inductor-${{ matrix.case.name }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" >> "${GITHUB_ENV}"
        printf 'Workflow run: %s, attempt: %s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" > "${RUNNER_TEMP}/example-onelab_inductor-${{ matrix.case.name }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
    - name: Select target commit
      id: target
      run: |
        if [ -n "${{ inputs.target_sha }}" ]; then
          target_sha="${{ inputs.target_sha }}"
        elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
          target_sha="${{ github.event.workflow_run.head_sha }}"
        else
          target_sha="${GITHUB_SHA}"
        fi
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
    - name: Resolve CUDA build artifact run
      id: artifact-run
      uses: actions/github-script@v7
      env:
        TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        BUILD_RUN_ID_INPUT: ${{ inputs.build_run_id }}
        ARTIFACT_NAME: similie-cuda-${{ steps.target.outputs.target_sha }}
      with:
        script: |
          if (process.env.BUILD_RUN_ID_INPUT) {
            core.setOutput('run_id', process.env.BUILD_RUN_ID_INPUT);
          } else if (context.eventName === 'workflow_run') {
            core.setOutput('run_id', String(context.payload.workflow_run.id));
          } else if (context.eventName === 'workflow_dispatch') {
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name: process.env.ARTIFACT_NAME, per_page: 100,
            });
            const matches = artifacts.filter((artifact) => !artifact.expired &&
              artifact.name === process.env.ARTIFACT_NAME && artifact.workflow_run);
            matches.sort((left, right) => right.id - left.id);
            if (matches.length === 0) core.setFailed(`No CUDA build artifact found for ${process.env.TARGET_SHA}`);
            else core.setOutput('run_id', String(matches[0].workflow_run.id));
          } else {
            core.setOutput('run_id', String(context.runId));
          }
    - name: Set build paths
      run: |
        echo "IMAGE_TAG=similie_env:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${RUNNER_TEMP}/similie-cuda-download-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=/tmp/similie-cuda-workspace-${{ steps.artifact-run.outputs.run_id }}-${TARGET_SHA}" >> "${GITHUB_ENV}"
        rm -rf "${RUNNER_TEMP}/similie-cuda-download-${GITHUB_RUN_ID}-${GITHUB_JOB}"
    - name: Download CUDA build workspace
      uses: actions/download-artifact@v8
      with:
        name: similie-cuda-${{ steps.target.outputs.target_sha }}
        path: ${{ runner.temp }}/similie-cuda-download-${{ github.run_id }}-${{ github.job }}
        run-id: ${{ steps.artifact-run.outputs.run_id }}
        github-token: ${{ github.token }}
    - name: Extract CUDA build workspace
      run: |
        tar -xzf "${CACHE_ROOT}/similie-cuda-workspace.tar.gz" -C "${CACHE_ROOT}"
        rm "${CACHE_ROOT}/similie-cuda-workspace.tar.gz"
    - name: Run ONELAB inductor ${{ matrix.case.name }} on GPU
      shell: bash
      run: |
        set -o pipefail
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm --gpus all \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:/similie-ci" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi

            export HOME=/similie-ci/home
            mkdir -p "${HOME}"
            case_name="${{ matrix.case.name }}"
            cd /similie-ci/build
            output_dir="${PWD}/onelab_inductor_cases/${case_name}"
            mkdir -p "${output_dir}"
            # Keep the 3D GetDP reference system small enough for the CI runner.
            mesh_args=()
            if [ "${{ matrix.case.dimension }}" = 3 ]; then
              mesh_args=(-setnumber "Input/11Mesh control (Nbr of divisions)/4Refinement factor" 1)
            fi
            SIMILIE_ONELAB_BUILD_DIR="${PWD}" \
            SIMILIE_ONELAB_MESH_FILE="${output_dir}/inductor.msh" \
            SIMILIE_ONELAB_RESULT_FILE="${output_dir}/similie_magnetostatics_inputs.pos" \
            SIMILIE_PARAVIEW_H5_FILE="${output_dir}/inductor.h5" \
            SIMILIE_PARAVIEW_XMF_FILE="${output_dir}/inductor.xmf" \
              "/similie-ci/src/examples/onelab_inductor/run_similie_onelab.sh" \
              "--dim=${{ matrix.case.dimension }}" \
              "--${{ matrix.case.physics }}" \
              "--${{ matrix.case.backend }}" \
              "${mesh_args[@]}"
          ' 2>&1 | tee -a "${EXAMPLE_LOG}"
    - name: Upload example outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: example-onelab_inductor-${{ matrix.case.name }}
        overwrite: true
        retention-days: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')) && 15 || 0 }}
        if-no-files-found: error
        path: |
          ${{ env.EXAMPLE_LOG }}
          ${{ env.CACHE_ROOT }}/build/onelab_inductor_cases/${{ matrix.case.name }}/
