name: build
on:
  workflow_run:
    workflows: [ build_env ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to build
        required: false
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      build_target:
        required: false
        type: string
        default: all
      ci_environment:
        required: false
        type: string
        default: automatic-ci-run

concurrency:
  group: build-${{ inputs.build_target || 'all' }}-${{ inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-cuda:
    if: (inputs.target_sha || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (!inputs.build_target || inputs.build_target == 'all' || inputs.build_target == 'cuda')
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ inputs.ci_environment || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && 'build-cuda' || 'automatic-ci-run') }}
    env:
      COMPILATION_NUM_THREADS: ${{ vars.COMPILATION_NUM_THREADS || '8' }}
    steps:
    - name: Select target commit
      id: target
      run: |
        if [ -n "${{ inputs.target_sha }}" ]; then
          target_sha="${{ inputs.target_sha }}"
          target_ref="${{ inputs.target_sha }}"
        elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
          target_sha="${{ github.event.workflow_run.head_sha }}"
          target_ref="${{ github.event.workflow_run.head_branch }}"
        else
          target_sha="${GITHUB_SHA}"
          target_ref="${GITHUB_REF_NAME}"
        fi
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "TARGET_REF=${target_ref}" >> "${GITHUB_ENV}"
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
    - name: Checkout built branch
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.target.outputs.target_sha }}
        submodules: recursive
        fetch-depth: 0
    - name: Clear temporary workspace path
      run: |
        echo "IMAGE_TAG=similie_env:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=/tmp/similie-cuda-workspace-${GITHUB_RUN_ID}-${TARGET_SHA}" >> "${GITHUB_ENV}"
        rm -rf "/tmp/similie-cuda-workspace-${GITHUB_RUN_ID}-${TARGET_SHA}"
    - name: Populate CUDA commit workspace
      run: |
        mkdir -p "${CACHE_ROOT}/src" "${CACHE_ROOT}/build" "${CACHE_ROOT}/home"
        rsync -a --delete "${GITHUB_WORKSPACE}/" "${CACHE_ROOT}/src/"
    - name: Configure and compile on GPU
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm --gpus all \
          --user "$(id -u):$(id -g)" \
          -e HOME="${CACHE_ROOT}/home" \
          -e CACHE_ROOT="${CACHE_ROOT}" \
          -e COMPILATION_NUM_THREADS="${COMPILATION_NUM_THREADS}" \
          -v "${CACHE_ROOT}:${CACHE_ROOT}" \
          -w "${CACHE_ROOT}/src" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            export PATH="/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}"
            git config --global --add safe.directory "*"
            nvidia-smi
            # The installed Kokkos package supplies its CUDA architecture flags.
            cmake \
              -DCMAKE_CXX_COMPILER=/opt/kokkos/bin/nvcc_wrapper \
              -DCMAKE_BUILD_TYPE=Release \
              -DKokkos_ENABLE_CUDA=ON \
              -DKokkos_ENABLE_DEPRECATION_WARNINGS=OFF \
              -DSIMILIE_BUILD_BENCHMARKS=ON \
              -DSIMILIE_ASSERT_EXAMPLE_RESULTS_CORRECTNESS=ON \
              -B "${CACHE_ROOT}/build" \
              -S .
            make -j"${COMPILATION_NUM_THREADS}" -C "${CACHE_ROOT}/build"
          '
    - name: Package CUDA build workspace
      run: tar -I 'gzip -1' -cf "${RUNNER_TEMP}/similie-cuda-workspace.tar.gz" --exclude='*/.git' -C "${CACHE_ROOT}" .
    - name: Upload CUDA build workspace
      uses: actions/upload-artifact@v7
      with:
        name: similie-cuda-${{ steps.target.outputs.target_sha }}
        overwrite: true
        path: ${{ runner.temp }}/similie-cuda-workspace.tar.gz
        compression-level: 0
        retention-days: 1

  build-omp-debug:
    if: (inputs.target_sha || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (!inputs.build_target || inputs.build_target == 'all' || inputs.build_target == 'omp')
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ inputs.ci_environment || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && 'build-omp-debug' || 'automatic-ci-run') }}
    env:
      COMPILATION_NUM_THREADS: ${{ vars.COMPILATION_NUM_THREADS || '8' }}
    steps:
    - name: Select target commit
      id: target
      run: |
        if [ -n "${{ inputs.target_sha }}" ]; then
          target_sha="${{ inputs.target_sha }}"
          target_ref="${{ inputs.target_sha }}"
        elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
          target_sha="${{ github.event.workflow_run.head_sha }}"
          target_ref="${{ github.event.workflow_run.head_branch }}"
        else
          target_sha="${GITHUB_SHA}"
          target_ref="${GITHUB_REF_NAME}"
        fi
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "TARGET_REF=${target_ref}" >> "${GITHUB_ENV}"
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
    - name: Checkout built branch
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.target.outputs.target_sha }}
        submodules: recursive
        fetch-depth: 0
    - name: Clear temporary workspace path
      run: |
        echo "IMAGE_TAG=similie_env_cpu:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=/tmp/similie-omp-workspace-${GITHUB_RUN_ID}-${TARGET_SHA}" >> "${GITHUB_ENV}"
        rm -rf "/tmp/similie-omp-workspace-${GITHUB_RUN_ID}-${TARGET_SHA}"
    - name: Populate OpenMP commit workspace
      run: |
        mkdir -p "${CACHE_ROOT}/src" "${CACHE_ROOT}/build_omp" "${CACHE_ROOT}/home"
        rsync -a --delete "${GITHUB_WORKSPACE}/" "${CACHE_ROOT}/src/"
    - name: Configure and compile with OpenMP
      run: |
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME="${CACHE_ROOT}/home" \
          -e CACHE_ROOT="${CACHE_ROOT}" \
          -e COMPILATION_NUM_THREADS="${COMPILATION_NUM_THREADS}" \
          -v "${CACHE_ROOT}:${CACHE_ROOT}" \
          -w "${CACHE_ROOT}/src" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            git config --global --add safe.directory "*"
            g++-15 --version
            cmake \
              -DCMAKE_CXX_COMPILER=g++-15 \
              -DCMAKE_BUILD_TYPE=Debug \
              -DKokkos_ENABLE_OPENMP=ON \
              -DKokkos_ENABLE_DEPRECATION_WARNINGS=OFF \
              -DSIMILIE_BUILD_YOUNG_TABLEAU=ON \
              -DSIMILIE_ASSERT_EXAMPLE_RESULTS_CORRECTNESS=ON \
              -B "${CACHE_ROOT}/build_omp" \
              -S .
            # Young tableaux generate the dictionary at runtime; tensor consumers
            # must compile after those entries exist for their #embed directive.
            make -j"${COMPILATION_NUM_THREADS}" -C "${CACHE_ROOT}/build_omp" unit_tests_young_tableau
            "${CACHE_ROOT}/build_omp/tests/young_tableau/unit_tests_young_tableau"
            make -j"${COMPILATION_NUM_THREADS}" -C "${CACHE_ROOT}/build_omp"
          '
    - name: Package OpenMP build workspace
      run: tar -I 'gzip -1' -cf "${RUNNER_TEMP}/similie-omp-workspace.tar.gz" --exclude='*/.git' -C "${CACHE_ROOT}" .
    - name: Upload OpenMP build workspace
      uses: actions/upload-artifact@v7
      with:
        name: similie-omp-${{ steps.target.outputs.target_sha }}
        overwrite: true
        path: ${{ runner.temp }}/similie-omp-workspace.tar.gz
        compression-level: 0
        retention-days: 1
