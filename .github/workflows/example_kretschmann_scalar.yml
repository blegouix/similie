name: example_kretschmann_scalar
permissions:
  actions: read
  contents: read
on:
  workflow_run:
    workflows: [ build ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Workflow run ID containing the matching compiled artifact
        required: false
      target_sha:
        description: Commit SHA to run the example from
        required: false
  workflow_call:
    inputs:
      build_run_id:
        required: false
        type: string
      target_sha:
        required: true
        type: string
      ci_environment:
        required: false
        type: string
        default: automatic-ci-run

concurrency:
  group: example-kretschmann_scalar-${{ inputs.target_sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  example-kretschmann_scalar:
    if: inputs.target_sha || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux]
    environment:
      name: ${{ inputs.ci_environment || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && 'examples-omp-debug' || 'automatic-ci-run') }}
    steps:
    - name: Prepare example log
      run: |
        echo "EXAMPLE_LOG=${RUNNER_TEMP}/example-kretschmann_scalar-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" >> "${GITHUB_ENV}"
        printf 'Workflow run: %s, attempt: %s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" > "${RUNNER_TEMP}/example-kretschmann_scalar-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
    - name: Select target commit
      id: target
      run: |
        if [ -n "${{ inputs.target_sha }}" ]; then
          target_sha="${{ inputs.target_sha }}"
        elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
          target_sha="${{ github.event.workflow_run.head_sha }}"
        else
          target_sha="${GITHUB_SHA}"
        fi
        echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"
        echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
    - name: Resolve OpenMP build artifact run
      id: artifact-run
      uses: actions/github-script@v7
      env:
        TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        BUILD_RUN_ID_INPUT: ${{ inputs.build_run_id }}
        ARTIFACT_NAME: similie-omp-${{ steps.target.outputs.target_sha }}
      with:
        script: |
          if (process.env.BUILD_RUN_ID_INPUT) {
            core.setOutput('run_id', process.env.BUILD_RUN_ID_INPUT);
          } else if (context.eventName === 'workflow_run') {
            core.setOutput('run_id', String(context.payload.workflow_run.id));
          } else if (context.eventName === 'workflow_dispatch') {
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name: process.env.ARTIFACT_NAME, per_page: 100,
            });
            const matches = artifacts.filter((artifact) => !artifact.expired &&
              artifact.name === process.env.ARTIFACT_NAME && artifact.workflow_run);
            matches.sort((left, right) => right.id - left.id);
            if (matches.length === 0) core.setFailed(`No OpenMP build artifact found for ${process.env.TARGET_SHA}`);
            else core.setOutput('run_id', String(matches[0].workflow_run.id));
          } else {
            core.setOutput('run_id', String(context.runId));
          }
    - name: Set build paths
      run: |
        echo "IMAGE_TAG=similie_env_cpu:${TARGET_SHA}" >> "${GITHUB_ENV}"
        echo "CACHE_ROOT=${RUNNER_TEMP}/similie-omp-download-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "${GITHUB_ENV}"
        echo "BUILD_ROOT=/tmp/similie-omp-workspace-${{ steps.artifact-run.outputs.run_id }}-${TARGET_SHA}" >> "${GITHUB_ENV}"
        rm -rf "${RUNNER_TEMP}/similie-omp-download-${GITHUB_RUN_ID}-${GITHUB_JOB}"
    - name: Download OMP build workspace
      uses: actions/download-artifact@v8
      with:
        name: similie-omp-${{ steps.target.outputs.target_sha }}
        path: ${{ runner.temp }}/similie-omp-download-${{ github.run_id }}-${{ github.job }}
        run-id: ${{ steps.artifact-run.outputs.run_id }}
        github-token: ${{ github.token }}
    - name: Extract OMP build workspace
      run: |
        tar -xzf "${CACHE_ROOT}/similie-omp-workspace.tar.gz" -C "${CACHE_ROOT}"
        rm "${CACHE_ROOT}/similie-omp-workspace.tar.gz"
    - name: Run kretschmann_scalar with OpenMP
      shell: bash
      run: |
        set -o pipefail
        docker image inspect "${IMAGE_TAG}" >/dev/null
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME="${BUILD_ROOT}/home" \
          -e CACHE_ROOT="${BUILD_ROOT}" \
          -v "${CACHE_ROOT}:${BUILD_ROOT}" \
          -w "${BUILD_ROOT}/build_omp" \
          "${IMAGE_TAG}" \
          bash -lc '
            set -euo pipefail
            mkdir -p "${HOME}"
            git config --global --add safe.directory "*"
            ./examples/kretschmann_scalar
            output="$(./examples/kretschmann_scalar)"
            printf "%s\n" "${output}"
            grep -Fx "Kreschmann scalar = 12" <<< "${output}"
          ' 2>&1 | tee -a "${EXAMPLE_LOG}"
    - name: Upload example outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: example-kretschmann_scalar
        overwrite: true
        retention-days: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')) && 15 || 0 }}
        if-no-files-found: error
        path: |
          ${{ env.EXAMPLE_LOG }}
